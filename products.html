
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahsulotlar | Online Dorixona</title>

  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <aside class="sidebar">
    <a class="brand" href="dashboard.html">
      <span class="brand-icon">
        <i class="fa-solid fa-prescription-bottle-medical"></i>
      </span>
      <span>Online<br>Dorixona</span>
    </a>

    <nav class="nav">
      <a href="dashboard.html">
        <span class="nav-icon"><i class="fa-solid fa-gauge-high"></i></span>
        <span>Dashboard</span>
      </a>

      <a class="active" href="products.html">
        <span class="nav-icon"><i class="fa-solid fa-pills"></i></span>
        <span>Mahsulotlar</span>
      </a>

      <a href="inventory.html">
        <span class="nav-icon"><i class="fa-solid fa-warehouse"></i></span>
        <span>Ombor</span>
      </a>

      <a href="sales.html">
        <span class="nav-icon"><i class="fa-solid fa-cart-shopping"></i></span>
        <span>Sotuvlar</span>
      </a>

      <a href="reports.html">
        <span class="nav-icon"><i class="fa-solid fa-chart-column"></i></span>
        <span>Hisobotlar</span>
      </a>

      <a href="settings.html">
        <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
        <span>Sozlamalar</span>
      </a>
    </nav>

    <div class="admin">
      <div class="avatar">A</div>
      <div>
        <b>Admin</b>
        <small>Administrator</small>
      </div>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <label class="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" placeholder="Qidiruv...">
      </label>

      <div class="top-right">
        <span class="top-chip">
          <i class="fa-solid fa-bell"></i> 3
        </span>

        <span class="top-chip">
          <i class="fa-regular fa-calendar"></i> 10.11.2026
        </span>
      </div>
    </header>

    <div class="heading">
      <div>
        <h1>Mahsulotlar</h1>
        <p>Dorixona mahsulotlarini boshqarish</p>
      </div>

      <a class="btn" href="product-add.html">
        <i class="fa-solid fa-plus"></i>
        Yangi mahsulot qo‘shish
      </a>
    </div>

    <section class="panel">

      <div class="toolbar">

        <input
          class="field"
          id="searchInput"
          type="search"
          placeholder="Mahsulot nomini qidirish..."
          style="max-width:240px"
        >

        <select class="field" id="categoryFilter" style="max-width:210px">
          <option value="">Barcha kategoriyalar</option>
          <option value="Pain Relief">Pain Relief</option>
          <option value="Allergy">Allergy</option>
          <option value="Vitamins">Vitamins</option>
          <option value="Antiseptic">Antiseptic</option>
          <option value="Digestive Health">Digestive Health</option>
          <option value="Nasal Care">Nasal Care</option>
          <option value="Skin Care">Skin Care</option>
          <option value="Medical Devices">Medical Devices</option>
          <option value="Eye Care">Eye Care</option>
        </select>

      </div>

      <div class="product-grid" id="productList">
        <p>Mahsulotlar yuklanmoqda...</p>
      </div>

      <div id="deletedProductsSection">
        <h2>O‘chirilgan mahsulotlar</h2>
        <div class="product-grid" id="deletedProductList"></div>
      </div>

    </section>

  </main>

  <footer class="footer">
    © 2026 Online Dorixona · Admin boshqaruv tizimi
  </footer>

  <script type="module" src="./dist/main.js"></script>

</body>
</html>
